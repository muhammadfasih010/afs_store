<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>AFS Preview</title>
        <style>
            body {
                margin: 0;
                font-family: Arial;
                background: #f6f1e4;
                color: #171311;
            }
            .bar {
                padding: 18px 6vw;
                background: #171311;
                color: #fff;
            }
            .wrap {
                max-width: 1100px;
                margin: auto;
                padding: 50px 6vw;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6vw;
            }
            img {
                width: 100%;
                max-height: 650px;
                object-fit: cover;
            }
            .price {
                font-size: 30px;
                margin: 20px 0;
            }
            button {
                padding: 15px 20px;
                border: 0;
                background: #9dbd1f;
                font-weight: bold;
                cursor: pointer;
            }
            a {
                color: #fff;
            }
            @media (max-width: 700px) {
                .wrap {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <div class="bar">
            <b>AFS LEATHER</b> · <a href="index.html">Back to shop</a>
        </div>
        <main class="wrap">
            <img id="img">
            <section>
                <small id="cat"></small>
                <h1 id="name"></h1>
                <div class="price" id="price"></div>
                <p id="desc"></p>
                <button id="add">Add to cart</button>
            </section>
        </main>
        <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
        <script src="config.js"></script>
        <script src="storage.js"></script>
        <script src="api.js"></script>
        <script src="preview.js"></script>
    </body>
</html>
